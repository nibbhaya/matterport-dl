# nginx config for serving matterport-dl downloads without run.py.
#
# All tours from one server, each in its own sub-folder:
#     http://<host>:<port>/<tour folder>/            ie  http://localhost:8080/xb99ucgvFAH/
# `root` is the folder that holds the tour folders (matterport-dl's downloads/ folder, or a copy of it).
# Tour folders can be renamed or nested (ie /tours/xb99/), as long as each still holds its own
# index.modified.html and JSNetProxy.js; the page works out its sub-path from the URL.
# Needs JSNetProxy.js with sub-path support (matterport-dl after Nov 2026); copy the new one into
# older downloads.
#
# Usage: set `root` and `listen`, include this file inside the `http { }` block of nginx.conf
# (it has map blocks as well as the server block), then `nginx -t` and reload.
#
# This copies what run.py's built-in server does:
#   - serves index.modified.html for the tour folder
#   - prefers <name>.modified.<ext> for .js/.json/.html (patched copies with non-expiring links)
#   - answers <tour>/api/mp/models/graph?operationName=X from <tour>/api/mp/models/graph_X(.modified).json
#   - maps ~ to _ in paths (downloads made with the default --no-tilde on macOS/Linux)
#   - falls back to <tour>/locale/strings.json for languages that were not downloaded
#   - maps dollhouse/floorplan texture crop requests (?crop=..&width=..) to the saved crop files
# Not copied: graph queries sent as POST (the viewer uses GET), and run.py's logging.

# Lookup tables (http level; avoids `if` inside location, which skips try_files).
map $arg_operationName $mpdl_graph_op {
    GetModelAssets  GetModelDetails;  # GetModelDetails' reply contains every field GetModelAssets asks for
    default         $arg_operationName;
}
map $arg_width $mpdl_crop_width {
    ""       "";
    default  "width=${arg_width}_";
}
map $arg_crop $mpdl_crop_file {
    ""       $uri;
    default  "$uri${mpdl_crop_width}crop=${arg_crop}.jpg";
}

server {
    listen 8080;
    server_name _;
    root /Users/wh/Desktop/WH/mport/matterport-dl/downloads;
    charset utf-8;
    index index.modified.html index.html;

    # Downloads made without tildes store "~" path segments as "_".
    rewrite ^(.*)~(.*)$ $1_$2 last;

    # Keep logs, run settings and the downloader's own scripts private (first: nginx uses the first matching regex location).
    location ~ /(run_report\.log|server\.log|run_args\.json|known_missing\.txt|recovered_missing\.txt|[^/]+\.py)$ {
        return 404;
    }

    # Graph (GraphQL) API answered from the saved query replies.
    location ~ ^(?<tour>/.+)/api/mp/models/graph$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $tour/api/mp/models/graph_$mpdl_graph_op.modified.json $tour/api/mp/models/graph_$mpdl_graph_op.json @graph_empty;
    }
    location @graph_empty {
        default_type application/json;
        return 200 '{"data": {"model": null}}';
    }

    # Languages that were not downloaded fall back to the default strings (if the download has them).
    location ~ ^(?<tour>/.+)/locale/messages/ {
        try_files $uri $tour/locale/strings.json =404;
    }

    # Prefer the patched .modified copy of js/json/html files.
    location ~ ^(?<base>.+)\.(?<ext>js|json|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $base.modified.$ext $uri =404;
    }

    # Dollhouse/floorplan textures: ?width=W&crop=C maps to "<file>width=W_crop=C.jpg" when that crop was saved.
    location ~ \.jpg$ {
        try_files $mpdl_crop_file $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
